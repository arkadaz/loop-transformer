[project]
name = "loop-transformer"
version = "0.1.0"
description = "A compact Gemma-distilled recurrent text model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "torch==2.14.0+cu130",
    "tqdm>=4.67.0",
    "tokenizers>=0.22.0",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
